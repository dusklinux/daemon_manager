name: Build TrollStore IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install Build Tools
        run: brew install xcodegen ldid

      - name: Check Presets and Override Failure Handling
        run: |
          python3 -m unittest discover -s tests -v
          swiftc DaemonApp/MemoryStatistics.swift tests/MemoryStatisticsTests.swift -o /tmp/daemon-memory-tests
          /tmp/daemon-memory-tests
          swiftc DaemonApp/DefaultPresets.swift DaemonApp/OverrideServices.swift tests/FeatureGroupsTests.swift -o /tmp/daemon-group-tests
          /tmp/daemon-group-tests
          swiftc -O DaemonApp/MemoryStatistics.swift DaemonApp/MemoryStress.swift tests/MemoryStressTests.swift -o /tmp/daemon-stress-tests
          /tmp/daemon-stress-tests

      - name: Generate Project & Compile
        run: |
          xcodegen generate
          xcodebuild clean build \
            -project DaemonApp.xcodeproj \
            -scheme DaemonApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Inject Entitlements & Package IPA
        run: |
          rm -rf Payload DaemonApp.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DaemonApp.app Payload/
          python3 - <<'PYCODE'
          import os, plistlib
          path = "Payload/DaemonApp.app/Info.plist"
          with open(path, "rb") as source:
              info = plistlib.load(source)
          info["DaemonManagerSourceCommit"] = os.environ["GITHUB_SHA"]
          with open(path, "wb") as destination:
              plistlib.dump(info, destination)
          PYCODE
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -fobjc-arc \
            -framework Foundation helpers/airdrop-policy.m -o Payload/DaemonApp.app/airdrop-policy
          ldid -S"helpers/airdrop-entitlements.plist" Payload/DaemonApp.app/airdrop-policy
          ldid -S"DaemonApp/entitlements.plist" Payload/DaemonApp.app/DaemonApp
          zip -qry DaemonApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaemonApp-iOS16
          path: DaemonApp.ipa

      - name: Create or Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.14
          target_commitish: ${{ github.sha }}
          name: "Daemon Manager v1.0.14"
          body: "Preserve the tested Photos image/video conversion dependencies and add a Photos sharing/export subpage, alongside the tested Apple Account/SMS repair set. Source commit: ${{ github.sha }}."
          files: DaemonApp.ipa
