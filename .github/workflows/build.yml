name: Build TrollStore IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install Build Tools
        run: brew install xcodegen ldid

      - name: Check Presets and Override Failure Handling
        run: python3 -m unittest discover -s tests -v

      - name: Generate Project & Compile
        run: |
          xcodegen generate
          xcodebuild clean build \
            -project DaemonApp.xcodeproj \
            -scheme DaemonApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Inject Entitlements & Package IPA
        run: |
          rm -rf Payload DaemonApp.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DaemonApp.app Payload/
          python3 - <<'PYCODE'
          import os, plistlib
          path = "Payload/DaemonApp.app/Info.plist"
          with open(path, "rb") as source:
              info = plistlib.load(source)
          info["DaemonManagerSourceCommit"] = os.environ["GITHUB_SHA"]
          with open(path, "wb") as destination:
              plistlib.dump(info, destination)
          PYCODE
          ldid -S"DaemonApp/entitlements.plist" Payload/DaemonApp.app/DaemonApp
          zip -qry DaemonApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaemonApp-iOS16
          path: DaemonApp.ipa

      - name: Create or Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          target_commitish: ${{ github.sha }}
          name: "Daemon Manager v1.0.2"
          body: "Critical service tab, direct recommendation toggles, Messages dependency defaults, and concise RAM display. Source commit: ${{ github.sha }}."
          files: DaemonApp.ipa
